name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Set version from tag (Self-hosted format)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=${TAG_NAME#v}
          export VERSION
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            m.version = `${v}.1`;
            m.version_name = `${v}s`;
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2));
          '
          echo "Version set to ${VERSION}.1 (${VERSION}s)"

      - name: Sign extension (Firefox AMO self-hosted)
        run: |
          web-ext sign \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=unlisted \
            --artifacts-dir=dist

      - name: Build Chrome Extension Package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=${TAG_NAME#v}
          mkdir -p build-chrome
          cp -r icons options background.js popup.css popup.html popup.js build-chrome/
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            delete m.background.scripts;
            delete m.browser_specific_settings;
            fs.writeFileSync("build-chrome/manifest.json", JSON.stringify(m, null, 2));
          '
          cd build-chrome && zip -r "../dist/chrome-auto-frequent-bookmarks-${VERSION}s.zip" . && cd ..

      - name: Find signed XPI
        id: xpi
        run: |
          path=$(find dist -name "*.xpi" | head -1)
          echo "path=$path" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.xpi.outputs.path }}
            dist/chrome-auto-frequent-bookmarks-*.zip
          generate_release_notes: true
